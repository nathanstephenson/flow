<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Flow</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5f6368" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!--
      Stock shadcn is light-first and switches on a `.dark` class, but Flow is dark today and
      flipping it to light would be a surprise unrelated to the restyle. So `.dark` is the default,
      set here rather than at mount so there is no light flash before React runs, and the one thing
      that turns it off is an explicit `prefers-color-scheme: light`. No switcher, nothing stored.

      `color-scheme` follows the same rule declaratively, so the transcript scrollbar and any native
      control are painted to match rather than staying light on a dark page.
    -->
    <meta name="color-scheme" content="dark light" />
    <script>
      if (window.matchMedia("(prefers-color-scheme: light)").matches) {
        document.documentElement.classList.remove("dark");
        document.documentElement.style.colorScheme = "light";
      }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
