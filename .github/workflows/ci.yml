# The first CI in this repo, added because the web client is a build artifact.
#
# Nothing generated is committed (ADR 0017), so there is no staleness to catch and no rebuild-and-
# diff step: the typecheck and the tests run against a tree with no build output in it, which is the
# property that lets them. What the artifact still needs is proof that it can be produced and
# embedded, and that is what the binary build at the end is for.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Not --omit=optional. Rolldown and lightningcss resolve their native bindings through
      # optional dependencies, and omitting them fails later with an unhelpful "cannot find native
      # binding" rather than at install time.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Nothing else exercises the single-executable build, and it is the path that reaches a user —
      # now also the only build that embeds a web client, so it is what proves the Vite build, the
      # manifest generator and the esbuild swap in scripts/build-binary.mjs still agree.
      - run: npm run build:binary
      - run: test "$(build/flow --version)" = "$(node -p 'require("./package.json").version')"

  # Real service-manager coverage: this job is a disposable VM, never a user's Session Host.
  systemd-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the VM's policy service
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends polkitd dbus
          sudo systemctl start polkit.service
      - name: Prepare the browser probe
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          echo "FLOW_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Exercise systemd-owned updates
        run: node scripts/test-systemd-update.mjs
        env:
          FLOW_SYSTEMD_VM_TEST: "1"
          FLOW_SYSTEMD_TEST_ARTIFACTS: ${{ github.workspace }}/build/systemd-update-test
      - name: Preserve update diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemd-update-diagnostics
          retention-days: 7
          path: build/systemd-update-test/
          if-no-files-found: warn

  package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test test/install-update.test.ts test/install-process.test.ts test/host-control.test.ts test/host-control-client.test.ts test/host-runtime.test.ts
      - run: npm run test:package
