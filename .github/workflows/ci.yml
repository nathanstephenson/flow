# The first CI in this repo, added because the web client is a build artifact.
#
# Nothing generated is committed (ADR 0017), so there is no staleness to catch and no rebuild-and-
# diff step: the typecheck and the tests run against a tree with no build output in it, which is the
# property that lets them. What the artifact still needs is proof that it can be produced and
# embedded, and that is what the binary build at the end is for.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Not --omit=optional. Rolldown and lightningcss resolve their native bindings through
      # optional dependencies, and omitting them fails later with an unhelpful "cannot find native
      # binding" rather than at install time.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Nothing else exercises the single-executable build, and it is the path that reaches a user —
      # now also the only build that embeds a web client, so it is what proves the Vite build, the
      # manifest generator and the esbuild swap in scripts/build-binary.mjs still agree.
      - run: npm run build:binary
